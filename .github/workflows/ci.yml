name: pipeline-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: "Ci_P@ssw0rd_2026!"
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server 2022 (repo bind-mounted at /repo)
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -p 1433:1433 \
            -v "$GITHUB_WORKSPACE:/repo" \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 60); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is up."; exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not come up in time"; docker logs mssql; exit 1

      - name: Install msodbcsql18 + pyodbc
        run: |
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18
          pip install --quiet pyodbc

      - name: Run pipeline end-to-end (init + load + quality gate)
        env:
          DWH_SA_PASSWORD: ${{ env.SA_PASSWORD }}
          DWH_DB_DATADIR: /var/opt/mssql/data
          DWH_DB_LANDING: /repo/db/landing
        run: |
          python pipeline/run_pipeline.py --server "tcp:localhost,1433"

      - name: Verify SCD2 change capture
        env:
          DWH_SA_PASSWORD: ${{ env.SA_PASSWORD }}
        run: |
          docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$SA_PASSWORD" -C -d DataWarehouse -b -Q "
              SELECT actual_name_bytes = CONVERT(VARBINARY(20), cst_firstname)
              FROM silver.crm_cust_info WHERE cst_id = 11253;
              IF NOT EXISTS (SELECT 1 FROM silver.crm_cust_info WHERE cst_id = 11253
                             AND CONVERT(VARBINARY(20), cst_firstname) = 0x4A006F007300E900)
                THROW 50004, 'UTF-8 decoding regressed: expected Jose with accent (0x4A006F007300E900)', 1;
              UPDATE bronze.crm_cust_info SET cst_marital_status = 'S' WHERE cst_id = 11000;
              EXEC silver.load_silver;
              EXEC gold.load_gold;
              IF (SELECT COUNT(*) FROM gold.dim_customers_scd2 WHERE customer_id = 11000) != 2
                THROW 50002, 'SCD2 did not version the changed customer', 1;
              EXEC etl.run_quality_checks;"

  # The same warehouse spec on PySpark + Delta Lake. No Databricks credentials
  # are involved: Delta Lake is open source, so the identical package that runs
  # on Databricks serverless runs here against local storage.
  lakehouse-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PySpark + Delta Lake
        run: pip install --quiet "pyspark==4.0.1" "delta-spark==4.0.1"

      - name: Build the lakehouse end-to-end (bronze -> silver -> gold + gates)
        run: python -m lakehouse.run_pipeline --steps all

      - name: Cross-engine parity against the T-SQL baseline
        run: |
          python tools/parity.py --engine spark --out build/parity_spark.json
          python tools/parity.py --compare \
            tests/parity_baseline_sqlserver.json build/parity_spark.json

      - name: Verify non-ASCII round-trip, SCD2 versioning, and idempotence
        run: python -m tests.lakehouse_checks
